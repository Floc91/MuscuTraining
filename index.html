<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de salle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15191c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Header with level, tabs; the body silhouette is the hero of Séance and Muscles; bottom sheet to log a set. */
:root{
  --bg:#e9ecee; --surface:#f7f8f9; --ink:#15191c; --mute:#5d676e; --line:#cfd5d9;
  --accent:#2540ff; --accent-ink:#ffffff; --gold:#e8a900; --gold-soft:#fff2c4;
  --skin:#d9dfe4; --skin2:#cbd3d9; --muscle:#c3ccd3; --muscle-line:#aab5be; --lit:#2540ff; --glow:rgba(37,64,255,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101315; --surface:#181d20; --ink:#eef1f2; --mute:#8b979e; --line:#2a3135;
    --accent:#7189ff; --accent-ink:#0b0f2e; --gold:#ffcb2e; --gold-soft:#3a3010;
    --skin:#222a30; --skin2:#2a343b; --muscle:#323d45; --muscle-line:#46535d; --lit:#7a90ff; --glow:rgba(122,144,255,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#181d20; --ink:#eef1f2; --mute:#8b979e; --line:#2a3135;
  --accent:#7189ff; --accent-ink:#0b0f2e; --gold:#ffcb2e; --gold-soft:#3a3010;
  --skin:#222a30; --skin2:#2a343b; --muscle:#323d45; --muscle-line:#46535d; --lit:#7a90ff; --glow:rgba(122,144,255,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,.mu:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1}
h2{font-size:24px}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}

header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:34px}
.lvl{font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:4px;white-space:nowrap}
.xp{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.xp>i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.xpline{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.stat .num{font-size:34px;line-height:1}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}

nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
nav button{flex:1;padding:10px 6px;border-radius:5px;font-weight:600;min-height:44px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stage{--body:#2f3a49;background:#1b222d;color:#ececec;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fig{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fig .label{color:#a9a9a9}
.fig svg{width:100%;max-width:200px;height:auto}
.cap{font-size:14px;margin:0;min-height:2.6em}
.cap b{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#b5b5b5}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.l1{background:#5b78a6}.l2{background:#3b82f6}.l3{background:#22b8ff}

/* body drawing */
.bd0{fill:var(--body);stroke:var(--body);stroke-width:2;stroke-linejoin:round}
.mu path{fill:url(#gO);stroke:var(--body);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.mu[data-l="1"] path{fill:url(#g1)}
.mu[data-l="2"] path{fill:url(#g2)}
.mu[data-l="3"] path{fill:url(#g3)}
.mu[data-l="3"]{filter:drop-shadow(0 0 4px rgba(34,184,255,.55))}
.mu.tap{cursor:pointer}
.mu.sel path{stroke:#fff;stroke-width:1.6}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate button{min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:24px}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:8px}
.mach{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:64px}
.mach:active{transform:scale(.99)}
.mach .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mach .sub{display:block;font-size:13px;color:var(--mute);font-weight:400}
.mach .mus{display:block;font-size:13px;color:var(--accent);font-weight:500}
.mach .w{font-size:26px;text-align:right;white-space:nowrap}
.mach .w small{font-size:14px;color:var(--mute);font-family:var(--f-body);font-weight:500}
.badge-n{min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700;padding:0 6px}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input,.add select,.bw input{flex:1;min-width:140px;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.fld input{width:100%;min-width:0;min-height:52px;font:inherit;font-size:17px;font-weight:500;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none;color-scheme:light dark;transition:border-color .15s,box-shadow .15s}
.fld input::placeholder{color:var(--mute);font-weight:400}
.fld input:focus,.fld input:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.fld input[type=date]{text-align:left;display:block}
.fld input[type=date]::-webkit-date-and-time-value{text-align:left}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;padding:12px 16px;min-height:48px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--mute)}
.bw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bw input{max-width:90px;flex:none;min-width:0}
.foot{font-size:12px;color:var(--mute);text-align:center}

.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 64px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.mrow .nm{font-weight:500;overflow-wrap:anywhere}
.bar2{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--lit);border-radius:4px;transition:width .35s}
.mrow .n{text-align:right;font-size:18px}
.mrow.sel{border-color:var(--ink)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .btn{flex:1}
.bar .sum{font-size:13px;color:var(--mute);min-width:90px}

.pr-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pr-card .nm{font-weight:600;overflow-wrap:anywhere}
.pr-card .rec{font-size:24px;text-align:right}
.pr-card svg{grid-column:1/-1;width:100%;height:44px;margin-top:4px}
.pr-card svg *{vector-effect:non-scaling-stroke}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;opacity:.55;min-width:0}
.bd.on{opacity:1;border-color:var(--gold);background:var(--gold-soft)}
.bd b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.01em}
.bd span{font-size:13px;color:var(--mute)}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.hist .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hist .row span:first-child{min-width:0;overflow-wrap:anywhere}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:30px}
.sheet .figs{max-width:240px;margin:0 auto;width:100%}
.setrow{display:grid;grid-template-columns:20px 1fr 1fr 36px;gap:8px;align-items:center}
.setrow .idx{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--mute);text-align:center}
.st{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.st button{width:38px;height:48px;font-size:22px;font-weight:700;flex:none}
.st input{flex:1;min-width:0;width:100%;text-align:center;font-family:var(--f-display);font-weight:700;font-size:26px;border:0;background:transparent;color:var(--ink);padding:0}
.setrow .del{width:36px;height:48px;color:var(--mute);font-size:20px}
.setsh{display:grid;grid-template-columns:20px 1fr 1fr 36px;gap:8px}
.setsh span{text-align:center}
.x{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.facts .num{font-size:22px;display:block}
.facts div.tgt{border-color:var(--accent)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.step .row{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between}
.step .val{font-size:44px;line-height:1}
.step button{width:48px;height:48px;border-radius:8px;border:1px solid var(--line);font-size:24px;font-weight:700;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.chip.pr{border-color:var(--gold);background:var(--gold-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:40;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;max-width:90%;text-align:center;animation:pop .35s}
.toast.gold{background:var(--gold);color:#2a1f00}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.xp>i,.mu path,.bar2 i{transition:none}}
.hrow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.hrow .l1r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hrow .dt{font-weight:600;display:inline-block}.hrow .dt::first-letter,.cap1::first-letter{text-transform:uppercase}
.hrow .sm{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.hrow .cm{font-size:13px;color:var(--accent);font-weight:500;overflow-wrap:anywhere}
textarea{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:84px}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.exb{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.exb .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exb .hd b{overflow-wrap:anywhere}
.mini{font-size:13px;color:var(--mute)}
.lk{color:var(--accent);font-weight:600;text-decoration:underline;padding:0 4px;min-height:44px;text-align:left}
.eset{display:grid;grid-template-columns:20px 1fr 1fr 36px;gap:8px;align-items:center}
.eset input{min-width:0;width:100%;font:inherit;font-family:var(--f-display);font-weight:700;font-size:22px;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.eset .idx{font-family:var(--f-display);font-weight:700;color:var(--mute);text-align:center}
.eset .del{width:36px;height:44px;color:var(--mute);font-size:20px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
.chartbox svg{width:100%;height:auto;display:block}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:right;font-weight:600;padding:4px 6px}
.ptable td{text-align:right;padding:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.sheet-bg.top{z-index:30}
.tag-est{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}
nav button{font-size:15px;padding-inline:2px}
.facts .num{font-size:20px;overflow-wrap:anywhere;line-height:1.1}
.setrow.one,.setsh.one{grid-template-columns:20px 1fr 36px}
html,body{margin:0}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="bar"></div>
<div id="sheet"></div>
<div id="pop"></div>
<div id="toast"></div>

<script>
(function(){
var TH={today:[1,3,6],week:[3,8,16],all:[8,25,60]};
var LS="carnet-salle-v2", GOAL_MIN=3, GOAL_WEEK=4;
function today(){return new Date().toLocaleDateString("sv")}

/* ---------- muscles ---------- */
var NAME={
  pecs:"Pectoraux", delt_ant:"Avant des épaules", delt_post:"Arrière des épaules",
  biceps:"Biceps", triceps:"Triceps", forearms:"Avant-bras",
  abs:"Abdominaux", obliques:"Obliques", traps:"Trapèzes",
  lats:"Grand dorsal", midback:"Milieu du dos", lowback:"Lombaires",
  glutes:"Fessiers", abd:"Abducteurs", add:"Adducteurs",
  quads:"Quadriceps", hams:"Ischio-jambiers", calves:"Mollets"
};
/* p = principal, s = secondaire */
var MU={

  tri:{triceps:"p"},

  calf:{calves:"p"}
};

var PROGN={mon:"Jambes",tue:"Haut",wed:"Cardio",thu:"Full body",long:"Sortie longue",all:"Séance libre"};
var DAYN={mon:"lundi",tue:"mardi",wed:"mercredi",thu:"jeudi"};
var TPL=["mon","tue","thu","wed","long","all"];
var nw={tpl:"all",name:"",d:null}, discardAsk=false;

/* ---------- silhouette (moitié gauche, miroir pour la droite) ---------- */
var MIR='transform="translate(200 0) scale(-1 1)"';
var OUT="M100 40 L93 42 C92 50 91 56 90 60 C84 63 72 64 63 66 C53 66 47 74 46 84 C45 100 44 120 43 140 C42 146 41 150 40 154 C38 170 35 190 33 206 C32 212 30 222 30 230 C30 238 36 242 40 238 C43 232 44 222 45 212 C47 196 51 172 54 152 C55 146 56 140 57 134 C58 122 60 108 63 98 C64 112 68 126 72 142 C73 158 72 176 68 192 C66 216 68 240 72 262 C74 276 75 288 77 296 C76 306 76 312 75 322 C72 336 74 356 79 376 L82 388 C80 396 76 402 78 406 L94 406 C96 402 94 394 92 386 C93 368 96 346 96 326 C97 312 97 304 96 296 C97 280 99 250 99 214 L99 205 L100 205 Z";
var HEAD="M100 3 C92 3 87 10 87 20 C87 28 89 35 92 40 C94 43 97 45 100 45 Z";
var DELT="M62 68 C53 67 47 74 46 84 C45 94 48 100 53 102 C59 98 64 92 66 82 C67 74 65 70 62 68 Z";
var FORE="M44 154 C42 170 38 190 35 206 C37 210 42 210 46 206 C50 192 53 172 55 154 C51 157 47 157 44 154 Z";
function absRow(a,b){return "M99 "+a+" L95 "+a+" Q91.5 "+a+" 91.5 "+(a+3.5)+" L91.5 "+(b-3.5)+" Q91.5 "+b+" 95 "+b+" L99 "+b+" Z"}
var FRONT=[
  ["traps",["M92 46 C91 56 88 61 80 64 C73 66 67 67 62 68 L67 74 C76 72 86 72 97 74 L97 56 C97 52 95 48 92 46 Z"]],
  ["pecs",["M99 74 C90 71 78 72 68 78 C63 84 63 94 68 101 C76 108 90 108 99 104 Z"]],
  ["delt_ant",[DELT]],
  ["biceps",["M52 104 C47 114 44 128 44 142 C46 148 50 149 54 146 C56 138 57 124 60 108 C58 106 55 104 52 104 Z"]],
  ["forearms",[FORE]],
  ["abs",[absRow(110,121),absRow(124,136),absRow(139,151),absRow(154,166),absRow(169,180)]],
  ["obliques",["M89 108 C82 108 76 112 72 122 C69 134 72 152 76 168 C80 176 84 180 88 182 C86 160 86 130 89 108 Z"]],

function R(n,m,w,r){var a=[];for(var i=0;i<n;i++)a.push([m,w,r]);return a}
var HIST=[];
function buildSeed(){
  var best={},prs=0,last={},out=[];
  HIST.forEach(function(h){
    var xp=30,sets=h.s.map(function(t){
      var st,score;
      if(Array.isArray(t)){st={m:t[0],w:t[1],r:t[2]};score=e1(t[1],t[2]);last[t[0]]=t[1]}
      else{st={m:t.m,t:t.t};if(t.k!=null)st.k=t.k;score=sc(st)}
      var pb=best[st.m],pr=pb!=null&&score>pb+0.001;
      if(pb==null||score>pb)best[st.m]=score;
      st.pr=pr;xp+=10+(pr?25:0);if(pr)prs++;
      return st;
    });
    var o={id:"h"+h.d,d:h.d,name:h.n||"",sets:sets,rates:{},comment:h.c,xp:xp};if(h.ap)o.ap=1;out.push(o);
  });
  return {sessions:out,prs:prs,last:last};
}
function ensureSeed(s){
  if(s.seedv>=3)return;
  var had=s.sessions.length>0,byId={},dates={};
  s.sessions.forEach(function(x){byId[String(x.id)]=x;dates[x.d]=1});
  var b=buildSeed();
  b.sessions.forEach(function(x){
    var ex=byId[x.id];
    if(ex&&!ex.name&&x.name)ex.name=x.name;
    if(ex){var have={};ex.sets.forEach(function(y){have[y.m]=1});x.sets.forEach(function(y){if(isT(y)&&!have[y.m])ex.sets.push(y)})}
    else if(!dates[x.d])s.sessions.push(x);
  });
  s.sessions.sort(function(a,c){return a.d<c.d?-1:a.d>c.d?1:0});
  if(!had){
    s.prs+=b.prs;
    s.machines.forEach(function(m){if(b.last[m.id]!=null)m.w=b.last[m.id]});
  }
  s.seedv=3;seededNow=true;
}

function chartSvg(pts,key,label,ff){

  function Y(v){return Tm+(1-(v-lo)/(hi-lo))*(H-Tm-Bm)}
  var g="",tk=[lo,(lo+hi)/2,hi];
  tk.forEach(function(v){var y=Y(v).toFixed(1);g+='<line x1="'+Lm+'" x2="'+(W-Rm)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(Lm-6)+'" y="'+(+y+3.5)+'" text-anchor="end" font-size="10" style="fill:var(--mute)">'+ff(v)+'</text>'});
  var d="",dots="",lab="",step=Math.max(1,Math.ceil(pts.length/5));

    dots+='<circle cx="'+x+'" cy="'+y+'" r="4" style="fill:var(--accent)"/>';

  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+(pts.length>1?'<path d="'+d+'" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+dots+vl+lab+'</svg>';

/* ---------- sauvegarde, import, export ---------- */
function backupJson(){return JSON.stringify({app:"carnet-salle",version:3,exported:new Date().toISOString(),data:S},null,2)}
function claudeText(n){
  var ses=S.sessions.slice();if(n)ses=ses.slice(-n);
  var L=["Carnet de salle, export du "+today()+" ("+ses.length+" séance"+(ses.length>1?"s":"")+")",""];
  function block(se,title){
    L.push(title);
    groups(se.sets).forEach(function(g){
      var m=mach(g.id),rt=se.rates&&se.rates[g.id];
      L.push("- "+(m?m.name:g.id)+" : "+g.items.map(function(it){return fmtSet(it.x)}).join(" ; ")+(rt?" (ressenti "+rt+"/5)":""));
    });
    if(se.comment)L.push("Commentaire : "+se.comment);
    L.push("");
  }
  ses.forEach(function(se){block(se,"Séance du "+se.d+(se.name?" ("+se.name+")":"")+(se.ap?" (données estimées)":""))});
  if(S.draft.sets.length)block({sets:S.draft.sets,rates:S.draft.rates,comment:S.draft.comment},"Séance en cours, non terminée");
  return L.join("\n");
}
function copyText(txt,ta){
  function fallback(){
    try{if(ta){ta.focus();ta.select();ta.setSelectionRange(0,txt.length)}var ok=document.execCommand&&document.execCommand("copy");bk.msg=ok?"Copié.":"Copie impossible : sélectionne le texte et copie-le à la main."}catch(e){bk.msg="Copie impossible : sélectionne le texte et copie-le à la main."}
    render();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){bk.msg="Copié.";render()},fallback);else fallback();
}
function saveFile(name,data,okMsg){
  var isJson=/\.json$/.test(name),type=isJson?"application/json":"text/plain";
  function done(){if(isJson){try{localStorage.setItem("carnet-last-export",today())}catch(e){}}bk.msg=okMsg;render()}
  function viaLink(){
    try{
      var url=URL.createObjectURL(new Blob([data],{type:type})),a=document.createElement("a");
      a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)},4000);done();
    }catch(e){bk.msg="Téléchargement impossible. Utilise la copie.";render()}
  }
  try{
    var file=new File([data],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).then(done,function(e){if(e&&e.name==="AbortError"){bk.msg="Enregistrement annulé.";render()}else viaLink()});
      return;
    }
  }catch(e){}
  viaLink();
}
function stageImport(text){
  try{
    var o=JSON.parse(text),d=o&&o.data&&Array.isArray(o.data.sessions)?o.data:o;
    if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.machines))throw 0;
    bk.pending=d;bk.msg="Sauvegarde lue : "+d.sessions.length+" séances, "+d.machines.length+" exercices. Elle remplacera les données actuelles.";
  }catch(e){bk.pending=null;bk.msg="Ce fichier n'est pas une sauvegarde du carnet."}
  render();
}
function snaps(){
  var ks=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("carnet-snap-")===0)ks.push(k.slice(12))}}catch(e){}
  return ks.sort().reverse();
}

   '<span class="label" style="margin-top:6px">Restaurer</span><input type="file" id="imp" data-f="imp" accept=".json,application/json" aria-label="Choisir un fichier de sauvegarde">'+

   (bk.pending?'<button class="btn" style="background:#b3261e;color:#fff" data-a="bimpyes">Confirmer : remplacer mes données</button><button class="btn ghost" data-a="bimpno">Annuler</button>':'')+'</div>'+
   '<div class="card"><span class="label">Partager mes séances avec Claude</span><div class="pills"><button class="pill" data-a="btxt" data-n="0">Toutes</button><button class="pill" data-a="btxt" data-n="10">10 dernières</button><button class="pill" data-a="btxt" data-n="4">4 dernières</button></div>'+

  return h;

function popHtml(){return chartId?chartHtml():det?detailHtml():""}
function sheetHtml(){
  if(!sh)return "";
  var m=mach(sh.id),kind=kindOf(sh.id),b=bestSet(sh.id,true),ls=lastSession(sh.id),t=target(sh.id),nn=muNames(sh.id);
  var done=S.draft.sets.filter(function(x){return x.m===sh.id}).map(function(x){return '<span class="chip'+(x.pr?" pr":"")+'">'+esc(fmtSet(x))+(x.pr?" ★":"")+'</span>'}).join("");
  var last=ls?(kind==="w"?fmt(Math.max.apply(null,ls.map(function(x){return x.w})))+" kg":fmtSet(ls[ls.length-1])):"—";
  var rec=b?(kind==="w"?fmt(b.w)+' × '+b.r:fmtSet(b)):'—';
  var cible=kind==="w"?fmt(t.w)+' kg':fmtSet(t.row);
  var mtxt=(nn.p.length||nn.s.length)?'<p class="cap">'+(nn.p.length?'<b>Principal :</b> '+esc(nn.p.join(", "))+'. ':'')+(nn.s.length?'<b>Secondaire :</b> '+esc(nn.s.join(", "))+'.':'')+'</p>':'';
  function stp(i,f,txt,lab){return '<div class="st"><button data-a="rw" data-i="'+i+'" data-f="'+f+'" data-d="-1" aria-label="Moins, '+lab+'">−</button><input data-f="'+f+'" data-i="'+i+'" inputmode="decimal" value="'+txt+'" aria-label="'+lab+'"><button data-a="rw" data-i="'+i+'" data-f="'+f+'" data-d="1" aria-label="Plus, '+lab+'">+</button></div>'}
  var rows=sh.rows.map(function(r,i){
    var n=i+1,cells;
    if(kind==="w")cells=stp(i,"w",fmt(r.w),"Charge série "+n)+stp(i,"r",r.r,"Reps série "+n);
    else if(kind==="t")cells=stp(i,"t",fmtClock(r.t),"Durée série "+n);
    else cells=stp(i,"t",fmtClock(r.t),"Durée série "+n)+stp(i,"k",r.k!=null?fmtKm(r.k):"","Distance km série "+n);
    return '<div class="setrow'+(kind==="t"?' one':'')+'"><span class="idx">'+n+'</span>'+cells+
      '<button class="del" data-a="del" data-i="'+i+'" aria-label="Supprimer la série '+n+'">×</button></div>';
  }).join("");
  var hdr=kind==="w"?'<span>Charge (kg)</span><span>Reps</span>':kind==="t"?'<span>Durée (min:s)</span>':'<span>Durée (min:s)</span><span>Distance (km)</span>';
  var delBlock=sh.del?'<div class="xpline"><span>La machine disparaît de la liste, ton historique est conservé.</span></div><button class="btn" style="background:#b3261e;color:#fff" data-a="mconfirm">Confirmer la suppression</button><button class="btn ghost" data-a="mcancel">Annuler</button>':'<button class="lk" data-a="mdel">Supprimer cette machine</button>';
  return '<div class="sheet-bg" data-a="bg"><div class="sheet" role="dialog" aria-label="'+esc(m.name)+'">'+
    '<div class="sheet-top"><h2>'+esc(m.name)+'</h2><button class="x" data-a="close" aria-label="Fermer">×</button></div>'+
    '<div class="stage">'+figs(machLevels(sh.id),false,null)+mtxt+'</div>'+
    '<div class="facts"><div><span class="label">Dernière</span><span class="num">'+esc(last)+'</span></div>'+
    '<div><span class="label">Record</span><span class="num">'+esc(rec)+'</span></div>'+
    '<div class="tgt"><span class="label">Cible</span><span class="num">'+esc(cible)+'</span></div></div>'+
    '<div class="xpline">'+esc(t.note)+'</div>'+
    (done?'<div><span class="label">Déjà validé aujourd\'hui</span><div class="chips" style="margin-top:6px">'+done+'</div><button class="btn ghost" style="margin-top:8px;width:100%" data-a="undo">Annuler la dernière série validée</button></div>':'')+
    '<div class="setsh label'+(kind==="t"?' one':'')+'"><span>#</span>'+hdr+'<span></span></div>'+
    rows+
    '<button class="btn ghost" data-a="addrow">+ Ajouter une série</button>'+
    '<button class="lk" data-a="chart" data-id="'+esc(sh.id)+'">Voir les courbes de cet exercice</button>'+
    '<div><span class="label">Ressenti de l\'exercice</span><div class="rate" style="margin-top:6px" role="group" aria-label="Note de 1 à 5">'+[1,2,3,4,5].map(function(n){return '<button data-a="rate" data-v="'+n+'" aria-pressed="'+(S.draft.rates[sh.id]===n)+'">'+n+'</button>'}).join("")+'</div><div class="xpline" style="margin-top:6px"><span>'+(S.draft.rates[sh.id]?RL[S.draft.rates[sh.id]]:"1 = très dur, 5 = excellent")+'</span></div></div>'+
    '<button class="btn" data-a="terminer"'+(sh.rows.length?'':' disabled')+'>Terminer l\'exercice</button>'+

function render(){
  var app=document.getElementById("app");
  var keep=document.getElementById("newm"),kv=keep?keep.value:"",ks=document.getElementById("newmu"),kk=ks?ks.value:"";
  var a0=document.activeElement,aid=a0&&/^(cmd|cmdet|pst)$/.test(a0.id||"")?a0.id:null,av=aid?a0.value:null,as=aid?a0.selectionStart:0;
  var tabs=[["seance","Séance"],["muscles","Muscles"],["histo","Historique"],["progres","Progrès"]].map(function(t){
    return '<button role="tab" data-a="tab" data-t="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("");
  app.innerHTML=headerHtml()+'<nav role="tablist">'+tabs+'</nav>'+
    (tab==="seance"?seanceHtml():tab==="muscles"?musclesHtml():tab==="histo"?historiqueHtml():progresHtml()+backupHtml())+
    '<div class="foot">'+esc(status)+(needBackup()?' · pense à enregistrer une sauvegarde (onglet Progrès)':'')+' · v'+APP_VERSION+'</div>';
  var ni=document.getElementById("newm");if(ni&&kv)ni.value=kv;
  var ns=document.getElementById("newmu");if(ns&&kk)ns.value=kk;
  var n=S.draft.sets.length;
  document.getElementById("bar").innerHTML='<div class="bar"><div class="in"><div class="sum">'+n+' série'+(n>1?"s":"")+'<br>'+(S.draft.xp||0)+' XP</div><button class="btn" data-a="finish"'+(n?"":" disabled")+'>Terminer la séance</button></div></div>';
  document.getElementById("sheet").innerHTML=sheetHtml();
  document.getElementById("pop").innerHTML=popHtml();
  if(aid){var ae=document.getElementById(aid);if(ae){ae.value=av;ae.focus();try{ae.setSelectionRange(as,as)}catch(_){}}}
}
function act(el){
  var a=el.getAttribute("data-a");
  if(a==="tab"){tab=el.getAttribute("data-t");render()}
  else if(a==="prog"){prog=el.getAttribute("data-p");render()}
  else if(a==="rng"){rng=el.getAttribute("data-r");render()}
  else if(a==="mu"){var k=el.getAttribute("data-m");pickM=pickM===k?null:k;render()}
  else if(a==="open")openSheet(el.getAttribute("data-id"));
  else if(a==="close"){sh=null;render()}
  else if(a==="rw"){
    var i=+el.getAttribute("data-i"),f=el.getAttribute("data-f"),d=+el.getAttribute("data-d"),row=sh.rows[i],kd=kindOf(sh.id);
    if(f==="w")row.w=Math.max(0,Math.round((row.w+d*2.5)*10)/10);
    else if(f==="r")row.r=Math.max(1,Math.min(99,row.r+d));
    else if(f==="t")row.t=Math.max(5,row.t+d*(kd==="t"?15:60));
    else if(f==="k")row.k=Math.max(0,Math.round(((row.k||0)+d*0.1)*100)/100);
    touch();render();
  }
  else if(a==="del"){sh.rows.splice(+el.getAttribute("data-i"),1);touch();render()}
  else if(a==="rate"){var v=+el.getAttribute("data-v");if(S.draft.rates[sh.id]===v)delete S.draft.rates[sh.id];else S.draft.rates[sh.id]=v;save();render()}
  else if(a==="addrow")addRow();
  else if(a==="startplan"){startSession(planned().k,null,null)}
  else if(a==="tpl"){nw.tpl=el.getAttribute("data-k");render()}
  else if(a==="startother"){var ne=document.getElementById("nwname"),de=document.getElementById("nwd");startSession(nw.tpl,(ne?ne.value:nw.name).trim(),de&&de.value?de.value:null)}
  else if(a==="mdiscard"){discardAsk=true;render()}
  else if(a==="mdiscardno"){discardAsk=false;render()}
  else if(a==="mdiscardyes"){S.draft={sets:[],xp:0,wip:{},rates:{},comment:"",meta:null};S.prs=Math.max(0,S.prs);discardAsk=false;sh=null;save();render();toast("Séance annulée")}
  else if(a==="bexp")saveFile("carnet-salle-"+today()+".json",backupJson(),"Sauvegarde enregistrée.");
  else if(a==="bcopy")copyText(backupJson(),null);
  else if(a==="btxt"){bk.text=claudeText(+el.getAttribute("data-n")||0);bk.msg="Texte prêt : copie-le et colle-le dans la conversation avec Claude.";render()}
  else if(a==="bcopytxt")copyText(bk.text,document.getElementById("exp"));
  else if(a==="bdltxt")saveFile("carnet-salle-seances-"+today()+".txt",bk.text,"Fichier enregistré.");
  else if(a==="bimpgo"){var pe=document.getElementById("pst");stageImport(pe?pe.value:"")}
  else if(a==="bsnap"){var sd=el.getAttribute("data-d"),tx=null;try{tx=localStorage.getItem("carnet-snap-"+sd)}catch(e){}if(tx)stageImport(tx);else{bk.msg="Point introuvable.";render()}}
  else if(a==="bimpno"){bk.pending=null;bk.msg="Import annulé.";render()}
  else if(a==="bimpyes"&&bk.pending){
    try{localStorage.setItem("carnet-salle-prev",JSON.stringify(S))}catch(e){}
    S=adopt(JSON.parse(JSON.stringify(bk.pending)));bk.pending=null;bk.msg="Sauvegarde importée. L'ancienne version est gardée en copie locale.";
    sh=null;det=null;chartId=null;save();render();toast("Sauvegarde importée");
  }
  else if(a==="mdel"){sh.del=true;render()}
  else if(a==="mcancel"){sh.del=false;render()}
  else if(a==="mconfirm"){var hm=mach(sh.id);if(hm)hm.hidden=true;delete S.draft.wip[sh.id];sh=null;save();render();toast("Machine supprimée, historique conservé")}
  else if(a==="mrestore"){var rm=mach(el.getAttribute("data-id"));if(rm){rm.hidden=false;save();render()}}
  else if(a==="sess"){det={id:el.getAttribute("data-id"),edit:false,del:false};render()}
  else if(a==="dclose"){det=null;render()}
  else if(a==="dedit"){det.edit=!det.edit;render()}
  else if(a==="ddel"){det.del=true;render()}
  else if(a==="dcancel"){det.del=false;render()}
  else if(a==="dconfirm"){var di=S.sessions.indexOf(sess(det.id));if(di>=0)S.sessions.splice(di,1);det=null;save();render();toast("Séance supprimée")}
  else if(a==="dset"){var se=sess(det.id);if(se){se.sets.splice(+el.getAttribute("data-i"),1);save();render()}}
  else if(a==="chart"){chartId=el.getAttribute("data-id");render()}
  else if(a==="cclose"){chartId=null;render()}
  else if(a==="terminer")terminer();
  else if(a==="undo")undo();
  else if(a==="finish")finish();
  else if(a==="add")addMachine();
  else if(a==="bw")setBw();
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;
  if(el.getAttribute("data-a")==="bg"){if(e.target===el){sh=null;render()}return}
  if(el.getAttribute("data-a")==="pbg"){if(e.target===el){if(chartId)chartId=null;else det=null;render()}return}
  act(el);
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t||!t.getAttribute)return;
  var f=t.getAttribute("data-f");if(!f)return;
  if(f==="nwn"){nw.name=t.value.slice(0,40);return}
  if(f==="nwd"){nw.d=t.value;return}
  if(f==="mdate"){if(t.value&&t.value<=today()&&S.draft.meta){S.draft.meta.d=t.value;save();render()}return}
  if(f==="sname"){var s1=sess(t.getAttribute("data-s"));if(s1){s1.name=t.value.slice(0,40);save()}return}
  if(f==="sdate"){var s2=sess(t.getAttribute("data-s"));if(s2&&t.value&&t.value<=today()){s2.d=t.value;sortSessions();save();render()}return}
  if(f==="imp"){var fl=t.files&&t.files[0];if(fl)fl.text().then(function(tx){t.value="";stageImport(tx)},function(){bk.msg="Lecture du fichier impossible.";render()});return}
  if(f==="cm"){
    var sid=t.getAttribute("data-s"),txt=String(t.value).slice(0,600);
    if(sid==="draft")S.draft.comment=txt;else{var se=sess(sid);if(se)se.comment=txt}
    save();return;
  }
  if(f==="ds"){
    var se2=det&&sess(det.id),x=se2&&se2.sets[+t.getAttribute("data-i")],k2=t.getAttribute("data-k");
    if(x){
      if(k2==="t"){var dv=parseDur(t.value);if(dv!==null){x.t=Math.max(1,dv);save()}}
      else if(k2==="k"){if(String(t.value).trim()===""){delete x.k;save()}else{var kv2=num(t.value);if(kv2!==null){x.k=Math.max(0,Math.round(kv2*100)/100);save()}}}
      else{var v2=num(t.value);if(v2!==null){if(k2==="w")x.w=Math.max(0,Math.round(v2*10)/10);else x.r=Math.max(1,Math.min(99,Math.round(v2)));save()}}
    }
    return;
  }
  if(!sh||t.tagName!=="INPUT")return;
  var i=+t.getAttribute("data-i"),row=sh.rows[i];
  if(!row)return;
  if(f==="t"){var dv=parseDur(t.value);if(dv!==null){row.t=Math.max(1,dv);touch()}}
  else if(f==="k"){if(String(t.value).trim()===""){delete row.k;touch()}else{var kv=num(t.value);if(kv!==null){row.k=Math.max(0,Math.round(kv*100)/100);touch()}}}
  else{var v=num(t.value);if(v!==null){if(f==="w")row.w=Math.max(0,Math.round(v*10)/10);else row.r=Math.max(1,Math.min(99,Math.round(v)));touch()}}
});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t.classList&&(t.classList.contains("mu")||t.classList.contains("pr-card"))){e.preventDefault();act(t)}
  if(e.key==="Escape"){if(chartId)chartId=null;else if(det)det=null;else if(sh)sh=null;else return;render()}
});
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",function(){if(nw.state==="installed"&&navigator.serviceWorker.controller)toast("Nouvelle version prête, elle s'applique au prochain lancement")});
      });
    }).catch(function(){});
  });
}
})();
